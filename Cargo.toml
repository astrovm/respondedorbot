[workspace]
members = [
    "crates/bot-adapters",
    "crates/bot-core",
    "crates/botd",
    "crates/python-bridge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/astrovm/respondedorbot"

[workspace.dependencies]
bot-adapters = { path = "crates/bot-adapters" }
bot-core = { path = "crates/bot-core" }
proptest = "1.11.0"
pyo3 = { version = "0.29.2", features = ["abi3-py314", "extension-module"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
