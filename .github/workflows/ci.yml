name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Main is protected by the PR checks; avoid running this validation again after merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  coverage:
    # Main is protected by the PR checks; avoid running this validation again after merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_DB: respondedorbot_test
          POSTGRES_PASSWORD: synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d respondedorbot_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: mirror.gcr.io/redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:synthetic-password@127.0.0.1:5432/respondedorbot_test?sslmode=disable
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: 6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Check Rust coverage
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --workspace --all-features --no-report
          # Check exported source lines: LLVM's summary can count phantom
          # uncovered lines across generic instantiations (rust-lang/rust#137524).
          cargo llvm-cov report -p bot-core --fail-uncovered-lines 0 --show-missing-lines
          cargo llvm-cov report -p bot-adapters --fail-uncovered-lines 0 --show-missing-lines
          cargo llvm-cov report -p botd --fail-uncovered-lines 0 --show-missing-lines

  fuzz:
    # Short smoke run of every fuzz target; long runs stay local.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Cache fuzz build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@0.13.2

      - name: Fuzz every target for a minute
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            mkdir -p "corpus/$target"
            # The prebuilt cargo-fuzz is a musl binary and would target musl.
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
              "$target" "corpus/$target" "seeds/$target" -- \
              -max_total_time=60 -max_len=16384 -rss_limit_mb=2048
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  mutants:
    # Mutation testing of the domain logic this pull request changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants@27.1.0

      - name: Mutate changed bot-core lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/$BASE_REF...HEAD" -- crates/bot-core/src > pr.diff
          status=0
          cargo mutants --in-diff pr.diff -p bot-core --timeout 180 --no-shuffle || status=$?
          # Exit 3 means some mutants made the tests hang, which still counts as
          # caught. It also wins over exit 2, so check the missed list directly.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
          if [ -s mutants.out/missed.txt ]; then cat mutants.out/missed.txt; exit 2; fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-report
          path: mutants.out

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Docker Hub rate-limits shared runners; Google's mirror doesn't.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Set image creation timestamp
        id: image-metadata
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image-metadata.outputs.created }}
          cache-from: type=gha,scope=respondedorbot
          cache-to: type=gha,mode=max,scope=respondedorbot

      - name: Verify image
        run: |
          mkdir -p "$RUNNER_TEMP/bot-workspace"
          printf '%s\n' 'synthetic personality' > "$RUNNER_TEMP/bot-workspace/SOUL.md"
          printf '%s\n' 'synthetic response rules' > "$RUNNER_TEMP/bot-workspace/RULES.md"
          docker run --rm \
            --env TELEGRAM_TOKEN=synthetic-telegram-token \
            --env TELEGRAM_USERNAME=synthetic_test_bot \
            --env DATABASE_URL=postgresql://synthetic-user:synthetic-password@db.synthetic.invalid:5432/postgres?sslmode=require \
            --env COINMARKETCAP_KEY=synthetic-coinmarketcap-key \
            --env OPENROUTER_API_KEY=synthetic-openrouter-key \
            --volume "$RUNNER_TEMP/bot-workspace:/app/workspace:ro" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" \
            /usr/local/bin/botd --check-config

  publish-latest:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Docker Hub rate-limits shared runners; Google's mirror doesn't.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Set image creation timestamp
        id: image-metadata
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image-metadata.outputs.created }}
          cache-from: type=gha,scope=respondedorbot
          cache-to: type=gha,mode=max,scope=respondedorbot

      - name: Verify image
        run: |
          mkdir -p "$RUNNER_TEMP/bot-workspace"
          printf '%s\n' 'synthetic personality' > "$RUNNER_TEMP/bot-workspace/SOUL.md"
          printf '%s\n' 'synthetic response rules' > "$RUNNER_TEMP/bot-workspace/RULES.md"
          docker run --rm \
            --env TELEGRAM_TOKEN=synthetic-telegram-token \
            --env TELEGRAM_USERNAME=synthetic_test_bot \
            --env DATABASE_URL=postgresql://synthetic-user:synthetic-password@db.synthetic.invalid:5432/postgres?sslmode=require \
            --env COINMARKETCAP_KEY=synthetic-coinmarketcap-key \
            --env OPENROUTER_API_KEY=synthetic-openrouter-key \
            --volume "$RUNNER_TEMP/bot-workspace:/app/workspace:ro" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" \
            /usr/local/bin/botd --check-config

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker push "${REPO}:sha-${{ github.sha }}"
          docker push "${REPO}:latest"

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - quality
      - coverage
      - fuzz
      - mutants
      - image
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. == "success")' <<< "$RESULTS"
