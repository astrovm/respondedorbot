name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        run: rustup show

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  coverage:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: respondedorbot_test
          POSTGRES_PASSWORD: synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d respondedorbot_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://postgres:synthetic-password@127.0.0.1:5432/respondedorbot_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:synthetic-password@127.0.0.1:5432/respondedorbot_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: 6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        run: rustup show

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Check Rust coverage
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --workspace --all-features --no-report -- --test-threads=1
          cargo llvm-cov report -p bot-core --fail-under-lines 95
          cargo llvm-cov report -p bot-adapters --fail-under-lines 95
          cargo llvm-cov report -p botd --fail-under-lines 95

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set image creation timestamp
        id: image-metadata
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image-metadata.outputs.created }}
          cache-from: type=gha,scope=respondedorbot
          cache-to: type=gha,mode=max,scope=respondedorbot

      - name: Verify image
        run: |
          docker run --rm \
            --env TELEGRAM_TOKEN=synthetic-telegram-token \
            --env TELEGRAM_USERNAME=synthetic_test_bot \
            --env SUPABASE_POSTGRES_URL=postgresql://synthetic-user:synthetic-password@db.synthetic.invalid:5432/postgres?sslmode=require \
            --env COINMARKETCAP_KEY=synthetic-coinmarketcap-key \
            --env OPENROUTER_API_KEY=synthetic-openrouter-key \
            --env BOT_SYSTEM_PROMPT=synthetic-system-prompt \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" \
            /usr/local/bin/botd --check-config

  publish-latest:
    if: github.event_name == 'push'
    needs:
      - quality
      - coverage
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set image creation timestamp
        id: image-metadata
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image-metadata.outputs.created }}
          cache-from: type=gha,scope=respondedorbot
          cache-to: type=gha,mode=max,scope=respondedorbot

      - name: Verify image
        run: |
          docker run --rm \
            --env TELEGRAM_TOKEN=synthetic-telegram-token \
            --env TELEGRAM_USERNAME=synthetic_test_bot \
            --env SUPABASE_POSTGRES_URL=postgresql://synthetic-user:synthetic-password@db.synthetic.invalid:5432/postgres?sslmode=require \
            --env COINMARKETCAP_KEY=synthetic-coinmarketcap-key \
            --env OPENROUTER_API_KEY=synthetic-openrouter-key \
            --env BOT_SYSTEM_PROMPT=synthetic-system-prompt \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" \
            /usr/local/bin/botd --check-config

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker push "${REPO}:sha-${{ github.sha }}"
          docker push "${REPO}:latest"
