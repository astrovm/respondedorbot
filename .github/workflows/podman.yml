name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        run: rustup show

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: respondedorbot_test
          POSTGRES_PASSWORD: synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d respondedorbot_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://postgres:synthetic-password@127.0.0.1:5432/respondedorbot_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:synthetic-password@127.0.0.1:5432/respondedorbot_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: 6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        run: rustup show

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Check Rust coverage
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --workspace --all-features --no-report -- --test-threads=1
          cargo llvm-cov report -p bot-core --fail-under-lines 95
          cargo llvm-cov report -p bot-adapters --fail-under-lines 95
          cargo llvm-cov report -p botd --fail-under-lines 95

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build image
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          CACHE_REPO="${REPO}-build-cache"
          CACHE_FLAGS=(--cache-from "${CACHE_REPO}")
          if [ "${{ github.event_name }}" = "push" ]; then
            CACHE_FLAGS+=(--cache-to "${CACHE_REPO}")
          fi
          podman build \
            --layers \
            "${CACHE_FLAGS[@]}" \
            --tag "${REPO}:sha-${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Verify image
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="${REPO}:sha-${{ github.sha }}"
          podman run --rm \
            --env TELEGRAM_TOKEN=synthetic-telegram-token \
            --env TELEGRAM_USERNAME=synthetic_test_bot \
            --env SUPABASE_POSTGRES_URL=postgresql://synthetic-user:synthetic-password@db.synthetic.invalid:5432/postgres?sslmode=require \
            --env COINMARKETCAP_KEY=synthetic-coinmarketcap-key \
            --env OPENROUTER_API_KEY=synthetic-openrouter-key \
            --env BOT_SYSTEM_PROMPT=synthetic-system-prompt \
            "${IMAGE}" /usr/local/bin/botd --check-config

  publish-latest:
    if: github.event_name == 'push'
    needs:
      - quality
      - coverage
      - image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build validated image from cache
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          CACHE_REPO="${REPO}-build-cache"
          podman build \
            --layers \
            --cache-from "${CACHE_REPO}" \
            --tag "${REPO}:sha-${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Verify validated image
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="${REPO}:sha-${{ github.sha }}"
          podman run --rm \
            --env TELEGRAM_TOKEN=synthetic-telegram-token \
            --env TELEGRAM_USERNAME=synthetic_test_bot \
            --env SUPABASE_POSTGRES_URL=postgresql://synthetic-user:synthetic-password@db.synthetic.invalid:5432/postgres?sslmode=require \
            --env COINMARKETCAP_KEY=synthetic-coinmarketcap-key \
            --env OPENROUTER_API_KEY=synthetic-openrouter-key \
            --env BOT_SYSTEM_PROMPT=synthetic-system-prompt \
            "${IMAGE}" /usr/local/bin/botd --check-config

      - name: Publish validated images
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          podman tag "${REPO}:sha-${{ github.sha }}" "${REPO}:latest"
          podman push "${REPO}:sha-${{ github.sha }}"
          podman push "${REPO}:latest"
