# Accepted advisories with no fix reachable through our dependencies.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0344"
reason = "ruzstd 0.3 comes from include-bytes-zstd (via ib-romaji), which only decompresses data embedded at build time, never user input. include-bytes-zstd 0.1.0 is the latest release and pins ruzstd ^0.3."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
reason = "ttf-parser is unmaintained, not vulnerable. It comes from ab_glyph, which is already at its latest release, and only parses system fonts installed in the container image."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0395"
reason = "zstd-safe 6.0 comes from include-bytes-zstd-macro (via ib-romaji), which only runs at build time to compress data embedded in the binary with a single-threaded Encoder, no dictionary and no experimental features. It never touches user input. include-bytes-zstd-macro 0.1.0 is the latest release and pins zstd ^0.12."

